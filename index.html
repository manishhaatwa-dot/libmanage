<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibManage SaaS - Universal Gateway</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Base Styling -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="gateway-container">

        <!-- Brand Header -->
        <header class="gateway-header">
            <h1>?? LibManage SaaS</h1>
            <p>Enterprise Multi-Library Network</p>
        </header>

        <!-- Gateway Router Tabs -->
        <div class="gateway-tabs">
            <button class="gateway-tab-btn active" id="tab-student">Student Access</button>
            <button class="gateway-tab-btn" id="tab-admin">Library Admin</button>
        </div>

        <!-- Card Section -->
        <div class="gateway-card glass">

            <!-- Student Panel -->
            <div id="panel-student" class="auth-panel active">
                <h2>Student Portal</h2>
                <p class="panel-subtitle">
                    Enter your unique identity token assigned by your library admin.
                </p>

               <form id="student-login-form">

    <div class="form-group">
        <label for="student-library-id">Library ID</label>
        <input
            type="text"
            id="student-library-id"
            placeholder="e.g. LIB-4DNL12"
            required
            autocomplete="off">
    </div>

    <div class="form-group">
        <label for="student-uid">Unique Student Code</label>
        <input
            type="text"
            id="student-uid"
            placeholder="e.g. LIB001"
            required
            autocomplete="off">
    </div>

    <button type="submit" class="btn-gateway-submit">
        Verify & Enter
    </button>

</form>
            </div>

            <!-- Admin Panel -->
            <div id="panel-admin" class="auth-panel">
                <h2>Admin Console</h2>
                <p class="panel-subtitle">
                    Manage seats, attendance and registers for your library branch.
                </p>

               <form id="admin-login-form">

    <div class="form-group">
        <label for="admin-library-id">Library ID</label>
        <input
            type="text"
            id="admin-library-id"
            placeholder="e.g. LIB-4DNL12"
            required
            autocomplete="username">
    </div>

    <div class="form-group">
        <label for="admin-password">Password</label>
        <input
            type="password"
            id="admin-password"
            placeholder="••••••••"
            required
            autocomplete="current-password">
    </div>

    <button type="submit" class="btn-gateway-submit">
        Secure Login
    </button>

</form> 
            </div>

        </div>

    </div>
<footer class="footer-panel">
        <p>&copy; 2026 LibManage Ecosystem. All Rights Reserved. | Powered by <a href="https://opnora.com" target="_blank" class="footer-brand-link">Opnora.com</a></p>
    </footer>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- Shared Core -->
    <script src="js/dashboard.js"></script>

    <script>
        const tabStudent = document.getElementById("tab-student");
        const tabAdmin = document.getElementById("tab-admin");
        const panelStudent = document.getElementById("panel-student");
        const panelAdmin = document.getElementById("panel-admin");

        tabStudent.addEventListener("click", () => {
            tabStudent.classList.add("active");
            tabAdmin.classList.remove("active");
            panelStudent.classList.add("active");
            panelAdmin.classList.remove("active");
        });

        tabAdmin.addEventListener("click", () => {
            tabAdmin.classList.add("active");
            tabStudent.classList.remove("active");
            panelAdmin.classList.add("active");
            panelStudent.classList.remove("active");
        });
    </script>

</body>
</html>
