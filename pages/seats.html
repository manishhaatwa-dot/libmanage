<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Seat Management</title>

    <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Navbar -->
        <div id="navbar-container"></div>

        <section class="page-content">

            <div class="page-header">
                <div>
                    <h1>Seat Management</h1>
                    <p>View library seat availability and occupancy.</p>
                </div>
            </div>

            <!-- Seat Summary -->
            <div class="stats-grid">

                <div class="stat-card glass">
                    <h3>Total Seats</h3>
                    <strong id="total-seats-count">0</strong>
                </div>

               <div class="stat-card glass available-seat-card" id="available-seats-card">
    <h3>Available</h3>
    <strong id="available-seats-count">0</strong>
</div>
<div id="shift-availability-modal" class="seat-modal-overlay">

    <div class="seat-modal glass">

        <div class="seat-modal-header">
            <h2>Shift-wise Availability</h2>

            <button
                type="button"
                id="close-shift-availability"
                class="modal-close-btn">
                ×
            </button>
        </div>

        <div id="shift-availability-content">

            <!-- Shift availability will load here -->

        </div>

    </div>

</div>
                <div class="stat-card glass">
                    <h3>Occupied</h3>
                    <strong id="occupied-seats-count">0</strong>
                </div>

            </div>

            <!-- Seat Controls -->
            <div class="search-filter-panel glass">

                <div class="search-box">
                    <input
                        type="text"
                        id="seat-search-input"
                        placeholder="Search seat or student name...">
                </div>

            </div>

            <!-- Seat Grid -->
            <div class="students-table-card glass">

                <div
                    id="seat-grid"
                    class="seat-grid">

                    <!-- Seats will load here -->

                </div>

            </div>

        </section>

        <!-- Footer -->
        <div id="footer-container"></div>

    </main>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- Shared Logic -->
    <script src="../js/dashboard.js"></script>

    <!-- Seat Logic -->
    <script src="../js/seats.js"></script>

</body>
</html>
