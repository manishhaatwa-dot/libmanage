<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Admin Dashboard</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>

<div class="app-container">

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <div class="main-content">

        <!-- Navbar -->
        <div id="navbar-container"></div>

        <main class="content-body">

            <!-- Header -->
            <div class="dashboard-header">

                <div class="welcome-text">

                    <h1 id="welcome-admin-title">
                        Library Admin Dashboard
                    </h1>

                    <p id="welcome-admin-subtitle">
                        Manage your complete library from one place.
                    </p>

                </div>

            </div>

            <!-- Top Quick Actions -->

            <div class="panel-card glass">

                <h2>Quick Branch Actions</h2>

                <div class="action-buttons-grid">

                    <a href="students.html" class="action-btn btn-primary">
                        <span class="btn-icon">?????</span>
                        Manage Students
                    </a>

                    <a href="attendance.html" class="action-btn btn-secondary">
                        <span class="btn-icon">??</span>
                        Mark Attendance
                    </a>

                    <a href="seats.html" class="action-btn btn-accent">
                        <span class="btn-icon">??</span>
                        Seat Matrix Map
                    </a>

                </div>

            </div>

            <!-- Main Layout -->

            <div class="dashboard-split">

                <div class="split-left">

                    <!-- Recent Notices -->

                    <div class="panel-card glass">

                        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">

                            <h2>Recent Notice Updates</h2>

                            <button
                                id="btn-add-notice"
                                class="ops-header-action">

                                + Add Notice

                            </button>

                        </div>

                        <div
                            class="notification-list"
                            id="recent-notices-container">

                        </div>

                    </div>

                </div>

                <!-- Right Panel -->

                <div class="split-right">

                </div>

            </div>

        </main>

        <!-- Footer -->

        <div id="footer-container"></div>

    </div>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<!-- Shared Core / Admin Dashboard Logic -->
<script src="../js/dashboard.js"></script>

<script>

document.addEventListener("DOMContentLoaded", async () => {

    // Session Check
    if (sessionStorage.getItem("session_role") !== "admin") {
        window.location.href = "../index.html";
        return;
    }

    const libraryName =
        sessionStorage.getItem("session_library_name") || "Library";

    const title =
        document.getElementById("welcome-admin-title");

    if (title) {
        title.innerText = libraryName;
    }

    const subtitle =
        document.getElementById("welcome-admin-subtitle");

    if (subtitle) {
        subtitle.innerText =
            "Library Admin Dashboard";
    }

    // Load Layout Components

    if (typeof loadSaaSLayoutComponent === "function") {

        await loadSaaSLayoutComponent(
            "sidebar-container",
            "../components/sidebar.html",
            () => {
                if (typeof handleSidebarActivation === "function") {
                    handleSidebarActivation();
                }
            }
        );

        await loadSaaSLayoutComponent(
            "navbar-container",
            "../components/navbar.html",
            () => {
                if (typeof bindNavbarInteractions === "function") {
                    bindNavbarInteractions();
                }
            }
        );

        await loadSaaSLayoutComponent(
            "footer-container",
            "../components/footer.html"
        );

    }

});

</script>

</body>
</html>
