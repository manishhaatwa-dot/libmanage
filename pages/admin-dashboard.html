<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Admin Dashboard</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/dashboard.css">

    <style>
        .notice-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999;
        }

        .notice-modal-overlay.active {
            display: flex;
        }

        .notice-modal-card {
            width: 100%;
            max-width: 560px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 25px 60px rgba(15, 23, 42, 0.22);
            overflow: hidden;
        }

        .notice-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 18px 20px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        }

        .notice-modal-header h3 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 700;
            color: #0f172a;
        }

        .notice-modal-close {
            border: none;
            background: transparent;
            font-size: 1.4rem;
            line-height: 1;
            cursor: pointer;
            color: #475569;
        }

        .notice-modal-body {
            padding: 20px;
        }

        .notice-form-group {
            margin-bottom: 16px;
        }

        .notice-form-label {
            display: block;
            font-size: 0.92rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .notice-form-input,
        .notice-form-textarea {
            width: 100%;
            border: 1px solid rgba(148, 163, 184, 0.35);
            border-radius: 12px;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            background: #ffffff;
            color: #0f172a;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .notice-form-input:focus,
        .notice-form-textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .notice-form-textarea {
            min-height: 130px;
            resize: vertical;
        }

        .notice-form-error {
            display: none;
            margin-bottom: 14px;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(239, 68, 68, 0.1);
            color: #b91c1c;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .notice-form-error.active {
            display: block;
        }

        .notice-form-success {
            display: none;
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(34, 197, 94, 0.12);
            color: #166534;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .notice-form-success.active {
            display: block;
        }

        .notice-modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 0 20px 20px;
            flex-wrap: wrap;
        }

        .notice-btn-secondary,
        .notice-btn-primary,
        .notice-delete-btn,
        .notice-edit-btn {
            border: none;
            cursor: pointer;
            border-radius: 12px;
            padding: 10px 16px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.92rem;
            transition: transform 0.15s ease, opacity 0.2s ease, box-shadow 0.2s ease;
        }

        .notice-btn-secondary {
            background: #e2e8f0;
            color: #0f172a;
        }

        .notice-btn-primary {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 10px 24px rgba(37, 99, 235, 0.24);
        }

        .notice-btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            box-shadow: none;
        }

        .notice-list-wrap {
            margin-top: 16px;
        }

        .notice-empty-state {
            padding: 16px;
            border-radius: 14px;
            background: rgba(148, 163, 184, 0.08);
            color: #475569;
            font-size: 0.95rem;
        }

        .notice-card {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 16px;
            padding: 16px;
            margin-top: 14px;
        }

        .notice-card:first-child {
            margin-top: 0;
        }

        .notice-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 10px;
        }

        .notice-card-title {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            color: #0f172a;
        }

        .notice-card-message {
            margin: 0;
            color: #334155;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .notice-card-footer {
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .notice-card-date {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 500;
        }

        .notice-card-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .notice-edit-btn {
            background: rgba(37, 99, 235, 0.12);
            color: #1d4ed8;
            padding: 8px 12px;
        }

        .notice-delete-btn {
            background: rgba(239, 68, 68, 0.12);
            color: #b91c1c;
            padding: 8px 12px;
        }

        .library-id-text {
            margin: 6px 0 0;
            font-size: 0.95rem;
            font-weight: 600;
            color: #475569;
        }

        @media (max-width: 640px) {
            .notice-modal-card {
                max-width: 100%;
            }

            .notice-modal-header,
            .notice-modal-body,
            .notice-modal-actions {
                padding-left: 16px;
                padding-right: 16px;
            }

            .notice-modal-actions {
                justify-content: stretch;
            }

            .notice-btn-secondary,
            .notice-btn-primary {
                width: 100%;
            }

            .notice-card-footer {
                align-items: stretch;
            }

            .notice-card-actions {
                width: 100%;
                flex-direction: column;
            }

            .notice-delete-btn,
            .notice-edit-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>

        <div class="main-content">

            <!-- Navbar -->
            <div id="navbar-container"></div>

            <main class="content-body">

                <!-- Header -->
                <div class="dashboard-header">

                    <div class="welcome-text">

                        <h1 id="welcome-admin-title">
                            Library Admin Dashboard
                        </h1>

                        <p id="welcome-admin-library-id" class="library-id-text">
                            Library ID: --
                        </p>

                        <p id="welcome-admin-subtitle">
                            Manage your complete library from one place.
                        </p>

                    </div>

                </div>

                <!-- Top Quick Actions -->
                <div class="panel-card glass">
                    <h2>Quick Branch Actions</h2>

                    <div class="action-buttons-grid">

                        <a href="students.html" class="action-btn btn-primary">
                            <span class="btn-icon">?????</span>
                            Manage Students
                        </a>

                        <a href="attendance.html" class="action-btn btn-secondary">
                            <span class="btn-icon">??</span>
                            Mark Attendance
                        </a>

                        <a href="seats.html" class="action-btn btn-accent">
                            <span class="btn-icon">??</span>
                            Seat Matrix Map
                        </a>

                    </div>
                </div>

                <!-- Main Layout -->
                <div class="dashboard-split">

                    <div class="split-left">

                        <!-- Recent Notices -->
                        <div class="panel-card glass">

                            <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
                                <h2>Recent Notice Updates</h2>

                                <button
                                    id="btn-add-notice"
                                    class="ops-header-action">
                                    + Add Notice
                                </button>
                            </div>

                            <div
                                class="notification-list notice-list-wrap"
                                id="recent-notices-container">
                            </div>

                        </div>

                    </div>

                    <!-- Right Panel -->
                    <div class="split-right"></div>

                </div>

            </main>

            <!-- Footer -->
            <div id="footer-container"></div>

        </div>

    </div>

    <!-- Notice Modal -->
    <div id="notice-modal-overlay" class="notice-modal-overlay" aria-hidden="true">
        <div class="notice-modal-card" role="dialog" aria-modal="true" aria-labelledby="notice-modal-title">
            <div class="notice-modal-header">
                <h3 id="notice-modal-title">Add Notice</h3>
                <button type="button" id="notice-modal-close" class="notice-modal-close" aria-label="Close notice modal">
                    &times;
                </button>
            </div>

            <div class="notice-modal-body">
                <div id="notice-form-error" class="notice-form-error"></div>

                <div class="notice-form-group">
                    <label for="notice-title-input" class="notice-form-label">Notice Title</label>
                    <input
                        type="text"
                        id="notice-title-input"
                        class="notice-form-input"
                        placeholder="Enter notice title">
                </div>

                <div class="notice-form-group">
                    <label for="notice-message-input" class="notice-form-label">Notice Message</label>
                    <textarea
                        id="notice-message-input"
                        class="notice-form-textarea"
                        placeholder="Enter notice message"></textarea>
                </div>

                <div id="notice-form-success" class="notice-form-success"></div>
            </div>

            <div class="notice-modal-actions">
                <button type="button" id="notice-cancel-btn" class="notice-btn-secondary">Cancel</button>
                <button type="button" id="notice-save-btn" class="notice-btn-primary">Save Notice</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- Shared Core / Admin Dashboard Logic -->
    <script src="../js/dashboard.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {

            if (localStorage.getItem("session_role") !== "admin") {
                window.location.href = "../index.html";
                return;
            }

            const libraryName =
                localStorage.getItem("session_library_name") || "Library";

            const libraryId =
                localStorage.getItem("session_library_id") || "--";

            const title =
                document.getElementById("welcome-admin-title");

            if (title) {
                title.innerText = libraryName;
            }

            const libraryIdText =
                document.getElementById("welcome-admin-library-id");

            if (libraryIdText) {
                libraryIdText.innerText = `Library ID: ${libraryId}`;
            }

            const subtitle =
                document.getElementById("welcome-admin-subtitle");

            if (subtitle) {
                subtitle.innerText = "Library Admin Dashboard";
            }

            if (typeof loadSaaSLayoutComponent === "function") {

                await loadSaaSLayoutComponent(
                    "sidebar-container",
                    "../components/sidebar.html",
                    () => {
                        if (typeof handleSidebarActivation === "function") {
                            handleSidebarActivation();
                        }
                    }
                );

                await loadSaaSLayoutComponent(
                    "navbar-container",
                    "../components/navbar.html",
                    () => {
                        if (typeof bindNavbarInteractions === "function") {
                            bindNavbarInteractions();
                        }
                    }
                );

                await loadSaaSLayoutComponent(
                    "footer-container",
                    "../components/footer.html"
                );
            }

            if (typeof initAdminNoticeModule === "function") {
                initAdminNoticeModule();
            }
        });
    </script>
</body>
</html>
