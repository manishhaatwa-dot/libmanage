<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Students Management</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/students.css" />
</head>
<body>

    <div class="dashboard-layout-shell">
        <aside id="sidebar-container"></aside>

        <div class="dashboard-main-column">
            <header id="navbar-container"></header>

            <main class="dashboard-content-area">

                <section class="page-title-strip">
                    <div>
                        <h1>Students Directory</h1>
                        <p>Manage all registered students under the selected library branch.</p>
                    </div>

                    <button class="primary-btn" id="open-add-modal-btn" type="button">
                        + Add Student
                    </button>
                </section>

                <section class="content-card glass">

                    <div class="toolbar-row">
                        <div class="toolbar-search-box">
                            <input
                                type="text"
                                id="student-search-input"
                                placeholder="Search by student code, seat, name, father name or class..."
                                autocomplete="off"
                            />
                        </div>
                    </div>

                    <div class="table-responsive-wrap">
                        <table class="data-table">

                            <thead>
                                <tr>
                                    <th>Student Code</th>
                                    <th>Seat No</th>
                                    <th>Name</th>
                                    <th>Father Name</th>
                                    <th>Class</th>
                                    <th>Joining Date</th>
                                    <th>Expiry Date</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>

                            <tbody id="students-table-rows">
                                <tr>
                                    <td colspan="9" class="table-empty">
                                        Loading student records...
                                    </td>
                                </tr>
                            </tbody>

                        </table>
                    </div>

                </section>

            </main>

            <footer id="footer-container"></footer>
        </div>
    </div>


    <!-- =========================================================
         STUDENT ADD / EDIT MODAL
         ========================================================= -->

    <div class="modal-overlay-shell" id="student-modal">

        <div class="modal-dialog-card">

            <div class="modal-header-strip">

                <div>
                    <h2 id="modal-title-context">
                        Register New Library Member
                    </h2>

                    <p id="modal-code-display-block" class="hide-element">
                        Student Code:
                        <strong id="modal-student-code-preview"></strong>
                    </p>
                </div>

                <button
                    class="icon-close-btn"
                    id="close-modal-btn"
                    type="button"
                    aria-label="Close modal"
                >
                    ×
                </button>

            </div>


            <form id="student-form" class="form-grid-layout">

                <input type="hidden" id="form-edit-index" value="" />
                <input type="hidden" id="form-student-code" value="" />


                <div class="form-field-block">
                    <label for="std-name">Student Name</label>

                    <input
                        type="text"
                        id="std-name"
                        name="name"
                        placeholder="Enter student name"
                        required
                    />
                </div>


                <div class="form-field-block">
                    <label for="std-father">Father Name</label>

                    <input
                        type="text"
                        id="std-father"
                        name="fatherName"
                        placeholder="Enter father name"
                        required
                    />
                </div>


                <div class="form-field-block">
                    <label for="std-class">Class</label>

                    <input
                        type="text"
                        id="std-class"
                        name="studentClass"
                        placeholder="Enter class"
                        required
                    />
                </div>


                <div class="form-field-block">
                    <label for="std-seat">Seat Number</label>

                    <input
                        type="text"
                        id="std-seat"
                        name="seatNumber"
                        placeholder="Enter seat number"
                        required
                    />
                </div>


                <div class="form-field-block">
                    <label for="std-shift">Shift</label>

                    <select id="std-shift" name="shift" required>

                        <option value="">
                            Select Shift
                        </option>

                        <option value="Morning">
                            Morning
                        </option>

                        <option value="Afternoon">
                            Afternoon
                        </option>

                        <option value="Evening">
                            Evening
                        </option>

                    </select>
                </div>


                <div class="form-field-block">
                    <label for="std-joining">Joining Date</label>

                    <input
                        type="date"
                        id="std-joining"
                        name="joiningDate"
                        required
                    />
                </div>


                <div class="form-field-block">
                    <label for="std-expiry">Expiry Date</label>

                    <input
                        type="date"
                        id="std-expiry"
                        name="expiryDate"
                        required
                    />
                </div>


                <div class="form-field-block">
                    <label for="std-status">Status</label>

                    <select id="std-status" name="status" required>

                        <option value="">
                            Select Status
                        </option>

                        <option value="Active">
                            Active
                        </option>

                        <option value="Expired">
                            Expired
                        </option>

                    </select>
                </div>


                <div class="form-actions-row">

                    <button
                        type="button"
                        class="secondary-btn"
                        id="cancel-form-btn"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        Save Student
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script src="../js/dashboard.js"></script>
    <script src="../js/students.js"></script>

</body>
</html>
