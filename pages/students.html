<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students - Library Admin</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/students.css">
</head>

<body>

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <main class="page-shell">

        <!-- Navbar -->
        <div id="navbar-container"></div>

        <section class="page-content">

            <!-- PAGE HEADER -->
            <div class="page-header">
                <div>
                    <h1>Students</h1>
                    <p>Manage student registrations for the current library.</p>
                </div>

                <button
                    id="open-add-modal-btn"
                    class="primary-btn"
                    type="button">
                    + Add Student
                </button>
            </div>


            <!-- SEARCH -->
            <section class="toolbar-card">

                <div class="toolbar-row">

                    <input
                        type="text"
                        id="student-search-input"
                        class="search-input"
                        placeholder="Search student by code, seat, name, father name, class, date, status or shift..."
                        autocomplete="off"
                    >

                </div>

            </section>


            <!-- STUDENTS TABLE -->
            <section class="table-card">

                <div class="table-responsive">

                    <table class="students-table">

                        <thead>
                            <tr>
                                <th>Student Code</th>
                                <th>Seat No</th>
                                <th>Name</th>
                                <th>Father Name</th>
                                <th>Class</th>
                                <th>Joining Date</th>
                                <th>Expiry Date</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="students-table-rows">

                            <tr>
                                <td
                                    colspan="9"
                                    class="table-empty"
                                    style="text-align:center; padding:2rem;">
                                    Loading students...
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </section>

        </section>


        <!-- FOOTER -->
        <div id="footer-container"></div>

    </main>



    <!-- =========================================================
         ADD / EDIT STUDENT MODAL
         ========================================================= -->

    <div
        id="student-modal"
        class="modal-overlay">

        <div class="modal-dialog">

            <!-- MODAL HEADER -->
            <div class="modal-header">

                <div>
                    <h2 id="modal-title-context">
                        Register New Library Member
                    </h2>

                    <p style="margin:4px 0 0; color:var(--text-muted); font-size:0.9rem;">
                        Enter student registration details
                    </p>
                </div>

                <button
                    id="close-modal-btn"
                    class="icon-btn"
                    type="button"
                    aria-label="Close modal">
                    ×
                </button>

            </div>


            <!-- STUDENT CODE DISPLAY DURING EDIT -->
            <div
                id="modal-code-display-block"
                class="hide-element modal-code-box">

                <span>Student Code</span>

                <strong id="modal-student-code-preview"></strong>

            </div>


            <!-- STUDENT FORM -->
            <form
                id="student-form"
                class="student-form">

                <!-- INTERNAL STATE -->
                <input
                    type="hidden"
                    id="form-edit-index"
                    value=""
                >

                <input
                    type="hidden"
                    id="form-student-code"
                    value=""
                >


                <!-- FORM GRID -->
                <div class="form-grid">


                    <!-- STUDENT NAME -->
                    <div class="form-group">

                        <label for="std-name">
                            Student Name
                        </label>

                        <input
                            type="text"
                            id="std-name"
                            placeholder="Enter student name"
                            required
                        >

                    </div>


                    <!-- FATHER NAME -->
                    <div class="form-group">

                        <label for="std-father">
                            Father Name
                        </label>

                        <input
                            type="text"
                            id="std-father"
                            placeholder="Enter father name"
                            required
                        >

                    </div>


                    <!-- CLASS -->
                    <div class="form-group">

                        <label for="std-class">
                            Class
                        </label>

                        <input
                            type="text"
                            id="std-class"
                            placeholder="e.g. 10th, 12th, B.A."
                            required
                        >

                    </div>


                    <!-- SEAT -->
                    <div class="form-group">

                        <label for="std-seat">
                            Seat No
                        </label>

                        <input
                            type="text"
                            id="std-seat"
                            placeholder="Enter seat number"
                            required
                        >

                    </div>


                    <!-- SHIFT -->
                    <div class="form-group">

                        <label for="std-shift">
                            Shift
                        </label>

                        <select id="std-shift" required>

                            <option value="">
                                Select Shift
                            </option>

                            <option value="Morning">
                                Morning
                            </option>

                            <option value="Evening">
                                Evening
                            </option>

                            <option value="Full Day">
                                Full Day
                            </option>

                        </select>

                    </div>


                    <!-- STATUS -->
                    <div class="form-group">

                        <label for="std-status">
                            Status
                        </label>

                        <select
                            id="std-status"
                            required>

                            <option value="">
                                Select Status
                            </option>

                            <option value="Active">
                                Active
                            </option>

                            <option value="Expired">
                                Expired
                            </option>

                        </select>

                    </div>


                    <!-- JOINING DATE -->
                    <div class="form-group">

                        <label for="std-joining">
                            Joining Date
                        </label>

                        <input
                            type="date"
                            id="std-joining"
                            required
                        >

                    </div>


                    <!-- EXPIRY DATE -->
                    <div class="form-group">

                        <label for="std-expiry">
                            Expiry Date
                        </label>

                        <input
                            type="date"
                            id="std-expiry"
                            required
                        >

                    </div>

                </div>


                <!-- FORM BUTTONS -->
                <div class="form-actions">

                    <button
                        id="cancel-form-btn"
                        type="button"
                        class="secondary-btn">
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="primary-btn">
                        Save Student
                    </button>

                </div>

            </form>

        </div>

    </div>



    <!-- =========================================================
         FIREBASE
         IMPORTANT: CONFIG MUST COME AFTER FIREBASE SDK
         ========================================================= -->

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>


    <!-- Firebase configuration -->
    <script src="../js/firebase-config.js"></script>

    <!-- Layout engine -->
    <script src="../js/layout.js"></script>

    <!-- Student CRUD engine -->
    <script src="../js/students.js"></script>

</body>
</html>
